plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.tys.printbridge'
    compileSdk 34

    defaultConfig {
        applicationId 'vn.tys.printbridge'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // cài thẳng được, không cần tạo khoá riêng
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
